<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="description" content="Local-first Codex usage evidence console">
    <title>Codex Usage Tracker</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="/assets/kernel-console/styles.css">
    <script type="module" src="/assets/kernel-console/app.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#workspace">Skip to workspace</a>
    <div class="app-shell" data-console-shell>
      <aside class="sidebar" aria-label="Primary navigation">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">&gt;_</span>
          <span><strong>Codex Usage Tracker</strong><small>Local evidence kernel</small></span>
        </div>
        <p class="local-badge">仅本机数据</p>
        <nav aria-label="Primary navigation">
          <a href="/live" data-route="live"><span aria-hidden="true">◉</span>用量</a>
          <a href="/compare" data-route="compare"><span aria-hidden="true">↗</span>账号对比</a>
          <a href="/explore" data-route="explore"><span aria-hidden="true">⌕</span>高级查询</a>
        </nav>
        <div class="sidebar-status">
          <span id="connection-dot" class="status-dot" aria-hidden="true"></span>
          <span id="connection-label">连接中…</span>
        </div>
      </aside>
      <div class="content">
        <header class="topbar">
          <button id="menu-toggle" class="icon-button" type="button" aria-label="Toggle navigation" aria-expanded="false">☰</button>
          <div>
            <span class="eyebrow">本地数据快照</span>
            <strong id="generation-label">Loading local index…</strong>
          </div>
          <div class="topbar-actions">
            <span id="freshness-chip" class="chip neutral">检查数据状态</span>
            <button id="refresh-button" class="button secondary" type="button">刷新数据</button>
          </div>
        </header>
        <main id="workspace" tabindex="-1" aria-live="polite"></main>
      </div>
    </div>
    <div id="toast-region" class="toast-region" role="status" aria-live="polite"></div>
  </body>
</html>
